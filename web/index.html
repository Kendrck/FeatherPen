<!-- 登录框国标实时校验JS，与后端正则完全同步 -->
<script>
// 前后端统一正则，无重复定义
const USERNAME_REG = /^[a-zA-Z0-9_\-.]{6,20}$/;
const EMAIL_REG = /^[a-zA-Z0-9_\-.]+@[a-zA-Z0-9_\-.]+\.[a-zA-Z]{2,}$/;
const PWD_REG = /^.{6,}$/;
const OFFLINE_GUEST_UID = "127001";
const PRIVILEGE_UID = new Set(["000000","111111","222222","333333","444444","555555","666666","777777","888888","999999"]);

function checkUsername(inputStr) {
    const trim = inputStr.trim();
    if(PRIVILEGE_UID.has(trim) || trim === OFFLINE_GUEST_UID) return {ok:true, msg:""};
    if(trim.length <6 || trim>20) return {ok:false, msg:"账号长度6-20位"};
    if(trim.includes("@")){
        if(!EMAIL_REG.test(trim)) return {ok:false, msg:"邮箱格式非法"};
    }else{
        if(!USERNAME_REG.test(trim)) return {ok:false, msg:"仅允许字母数字_-.，禁止中文空格"};
    }
    return {ok:true, msg:""};
}

function checkPassword(pwdStr) {
    const trim = pwdStr.trim();
    if(!PWD_REG.test(trim)) return {ok:false, msg:"密码最少6位"};
    return {ok:true, msg:""};
}
</script>
